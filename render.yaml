databases:
  - name: freshrss-db
    databaseName: freshrss
    user: freshrss
    plan: free
    region: oregon

services:
  - type: web
    name: freshrss
    runtime: image
    image:
      url: freshrss/freshrss:latest
    region: oregon
    plan: free
    envVars:
      - key: TZ
        value: UTC
      - key: BASE_URL
        value: https://cti-freshrss.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: freshrss-db
          property: host
      - key: DB_BASE
        fromDatabase:
          name: freshrss-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: freshrss-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: freshrss-db
          property: password
      - key: ADMIN_EMAIL
        value: andrew@local.net
      - key: ADMIN_PASSWORD
        value: freshrss
      - key: ADMIN_API_PASSWORD
        value: freshrss
      # Explicitly set the default user variable recognized by the container entrypoint
      - key: FRESHRSS_DEFAULT_USER
        value: andrew
      - key: FRESHRSS_INSTALL
        value: |-
          --api-enabled --base-url ${BASE_URL} --db-base ${DB_BASE} --db-host ${DB_HOST} --db-password ${DB_PASSWORD} --db-type pgsql --db-user ${DB_USER} --default-user ${FRESHRSS_DEFAULT_USER} --language en
      - key: FRESHRSS_USER
        value: |-
          --api-password ${ADMIN_API_PASSWORD} --email ${ADMIN_EMAIL} --language en --password ${ADMIN_PASSWORD} ${FRESHRSS_DEFAULT_USER}

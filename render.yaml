services:
  - type: web
    name: freshrss
    env: image
    region: oregon
    plan: free
    envVars:
      - key: TZ
        value: UTC
      - key: BASE_URL
        value: https://cti-freshrss.onrender.com
      - key: DB_HOST
        value: dpg-dbk6vfe7bikc739bggeg-a  # Update this with your actual Render PostgreSQL internal/external host
      - key: DB_BASE
        value: freshrss
      - key: DB_USER
        value: freshrss
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: andrew@local.net
      - key: ADMIN_PASSWORD
        value: freshrss
      - key: ADMIN_API_PASSWORD
        value: freshrss
      # --- Automatic Setup & User Provisioning ---
      - key: FRESHRSS_INSTALL
        value: |-
          --api-enabled --base-url ${BASE_URL} --db-base ${DB_BASE} --db-host ${DB_HOST} --db-password ${DB_PASSWORD} --db-type pgsql --db-user ${DB_USER} --default-user andrew --language en
      - key: FRESHRSS_USER
        value: |-
          --api-password ${ADMIN_API_PASSWORD} --email ${ADMIN_EMAIL} --language en --password ${ADMIN_PASSWORD} andrew
